[package]
name = "boiled_crab"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web framework
axum = "0.8.9"
tokio = { version = "1.40", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-native-tls", "mysql"] }
sea-orm = { version = "1.0", features = ["runtime-tokio-native-tls", "sqlx-mysql", "macros", "debug-print"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Utilities
dotenv = "0.15"
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1.10"

# Validation
validator = { version = "0.18", features = ["derive"] }

# Hashing & Security
bcrypt = "0.15"
jsonwebtoken = "9.3"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Async utilities
futures = "0.3"
async-trait = "0.1"

[dev-dependencies]
tokio-test = "0.4"
mockall = "0.12"
async-trait = "0.1"
